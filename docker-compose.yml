services:
  postgres:
    image: postgres:16-alpine
    container_name: verx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: verx
      POSTGRES_PASSWORD: verx
      POSTGRES_DB: verx
    ports:
      - '5432:5432'
    volumes:
      - verx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U verx -d verx']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verx-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verx-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://verx:verx@postgres:5432/verx?schema=public
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DASHBOARD_CACHE_TTL_SECONDS: 300
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/docs',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Endereço da API alcançável pelo navegador (não pela rede interna
        # do compose) — a porta 3000 do serviço `api` já é publicada acima.
        VITE_API_URL: http://localhost:3000/api/v1
    container_name: verx-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  verx_postgres_data:
