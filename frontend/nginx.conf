server {
    # Dual-stack: o healthcheck do docker-compose chama `wget` contra
    # `localhost`, que resolve para ::1 antes de 127.0.0.1 neste container —
    # sem o listener IPv6 explícito, a conexão é recusada (o script de
    # entrypoint do nginx só adiciona isso sozinho ao arquivo padrão, não a
    # um default.conf customizado como este).
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida cai em index.html (React Router assume
    # a partir daí) — necessário a partir de F1/F2, quando as rotas reais
    # existirem.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
